<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Course</title>
</head>
<body>
    <h1>Create New Course</h1>
    <form action="/app/createCourse" method="post">
    <label>Course name:
        <input type="text" name="course-name" required>
    </label>
    <br><br>
    <label>Start time:
        <input type="time" name="start-time" required>
    </label>
    <br><br>
    <label>End time:
        <input type="time" name="end-time" required>
    </label>
    <br><br>

    <p>Days of the week:</p>
    <label><input type="checkbox" name="day-mon"> Monday</label>
    <label><input type="checkbox" name="day-tue"> Tuesday</label>
    <label><input type="checkbox" name="day-wed"> Wednesday</label>
    <label><input type="checkbox" name="day-thu"> Thursday</label>
    <label><input type="checkbox" name="day-fri"> Friday</label>
    <br><br>
    <button type="submit">Create Course</button>
    </form>
</body>
</html>
