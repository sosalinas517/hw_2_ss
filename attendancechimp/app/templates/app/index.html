<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AttendanceChimp</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 40px; }
        .bio { max-width: 600px; margin: 0 auto; }
        .username { font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
<div class="bio">
    <h1>AttendanceChimp</h1>
    <p>Electronic class attendance tracking application. It is designed to track student attendance during class</p>
    <hr>
    {% if user.is_authenticated %}
        <p class="username">{{ user.username }}</p>
    {% else %}
        <p class="username">Not logged in.</p>
    {% endif %}

    <p>Current Time (CST): {{ current_time }}</p>
</div>
</body>
</html>
